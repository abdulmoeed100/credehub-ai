name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  # Allows manual run from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Push the main branch to Hugging Face Space git repository.
          # Note: Replace 'credehub-ai' with your Space name if you name it differently.
          git push --force https://moeed77:$HF_TOKEN@huggingface.co/spaces/moeed77/credehub-ai main
