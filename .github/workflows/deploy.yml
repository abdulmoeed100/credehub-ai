name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  # Allows manual run from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Sync to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: abdulmoeed100/credehub-ai
          huggingface_repo_id: moeed77/credehub-ai
          hf_token: ${{ secrets.HF_TOKEN }}
